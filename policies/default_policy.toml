# AgentFence Default Security Policy
policy_version = "1.0.0"

[workspace]
# Default workspace path if relative
relative_root = "workspace"

[tools.list_files]
enabled = true

[tools.read_file]
enabled = true
max_size_bytes = 1048576  # 1MB limit

[tools.write_file]
enabled = true
max_size_bytes = 1048576  # 1MB limit

[tools.delete_file]
enabled = true
approval_required = true

[tools.run_command]
enabled = true
allowed_commands = ["python3", "pytest", "ls", "cat", "echo", "grep", "head", "tail", "wc"]
max_timeout_seconds = 30
max_output_bytes = 1048576  # 1MB
sandbox_image = "agentfence-sandbox:0.1.0"

[tools.network_request]
enabled = false

[tools.open_application]
enabled = false
